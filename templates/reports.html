{% extends "base.html" %}

{% block page_title %}Reports{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h5 class="card-title">Claim Reports</h5>
        <p class="text-muted">Graphical reports will be available here.</p>
        
        <!-- Setup Chart.js canvas -->
        <canvas id="claimChart" width="400" height="200"></canvas>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Placeholder chart logic
    const ctx = document.getElementById('claimChart').getContext('2d');
    const claimChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Claimed', 'Not Claimed'],
            datasets: [{
                data: [1, 1],
                backgroundColor: ['#10b981', '#f59e0b']
            }]
        }
    });

    // Update with real data from /dashboard/api/stats
    fetch('/dashboard/api/stats')
        .then(res => res.json())
        .then(data => {
            claimChart.data.datasets[0].data = [data.claimed, data.not_claimed];
            claimChart.update();
        });
</script>
{% endblock %}

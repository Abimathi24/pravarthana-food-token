<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pravarthana26 - Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-panel {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="login-panel glass-panel animate-fade-in text-center">
        <h3 class="header-gradient mb-4"><i class="bi bi-shield-lock-fill me-2"></i>Admin Login</h3>
        {% if error %}
        <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="mb-4 text-start">
                <label class="form-label text-muted small fw-bold">ADMIN PASSWORD</label>
                <input type="password" name="password" class="form-control" required placeholder="Enter password...">
            </div>
            <button type="submit" class="btn btn-custom w-100">Login to Dashboard</button>
        </form>
    </div>
</body>
</html>

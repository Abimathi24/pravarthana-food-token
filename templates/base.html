<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pravarthana 2026 - QR Food Claim</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    
    <div class="d-flex" id="wrapper">
        <div class="sidebar shadow-sm" id="sidebar-wrapper">
            <div class="sidebar-heading text-center py-4 fs-5 fw-bold">
                <i class="fas fa-qrcode text-primary me-2"></i>PRAVARTHANA 26
            </div>
            <div class="list-group list-group-flush mt-2">
                {% if g.role == 'admin' %}
                <a href="{{ url_for('dashboard.index') }}" class="list-group-item list-group-item-action"><i class="fas fa-home me-2"></i>Dashboard</a>
                <a href="{{ url_for('participants.index') }}" class="list-group-item list-group-item-action"><i class="fas fa-users me-2"></i>Participants</a>
                <a href="{{ url_for('admin.import_pdf') }}" class="list-group-item list-group-item-action"><i class="fas fa-upload me-2"></i>Import PDF</a>
                <a href="{{ url_for('scanner.index') }}" class="list-group-item list-group-item-action"><i class="fas fa-camera me-2"></i>Scan QR</a>
                {% else %}
                <a href="{{ url_for('scanner.index') }}" class="list-group-item list-group-item-action"><i class="fas fa-camera me-2"></i>Scan QR</a>
                {% endif %}
                <a href="{{ url_for('auth.logout') }}" class="list-group-item list-group-item-action text-danger mt-5"><i class="fas fa-sign-out-alt me-2"></i>Logout</a>
            </div>
        </div>
        
        <!-- Page Content -->
        <div id="page-content-wrapper" class="w-100">
            <nav class="navbar navbar-expand-lg navbar-dark shadow-sm py-3">
                <div class="container-fluid">
                    <button class="btn btn-primary d-md-none" id="menu-toggle"><i class="fas fa-bars"></i></button>
                    <h5 class="mb-0 ms-3 fw-semibold">{% block page_title %}{% endblock %}</h5>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav ms-auto mt-2 mt-lg-0">
                            <li class="nav-item active">
                                <span class="nav-link"><i class="fas fa-user-circle me-1"></i> {{ g.role | capitalize }}</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
            
            <div class="container-fluid p-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Sidebar Toggle Script
        document.getElementById("menu-toggle").addEventListener("click", function(e) {
            e.preventDefault();
            document.getElementById("wrapper").classList.toggle("toggled");
        });
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
